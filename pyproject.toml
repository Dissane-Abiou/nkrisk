[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nkrisk"
version = "0.1.0"
description = "Moteur de mesure de risque de portefeuille qui declare son incertitude"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "scikit-learn>=1.4"]
data = ["yfinance>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests de couverture Monte Carlo (lents, mais les plus importants)",
]
# Par defaut on exclut les tests lents : la boucle de developpement doit
# rester sous la seconde, sinon on cesse de lancer les tests.
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/F : les bases. I : ordre des imports. B : pièges courants (bugbear).
# SIM : simplifications. RUF : règles propres à ruff. UP : modernisations.
select = ["E", "F", "I", "B", "SIM", "RUF", "UP"]

# RUF001/002/003 signalent les caractères Unicode « ambigus ». La règle
# existe pour détecter les attaques par homoglyphe — un « а » cyrillique
# déguisé en « a » latin dans un identifiant. C'est un vrai risque dans
# une base de code qui accepte des contributions anonymes.
#
# Ici, les 161 occurrences sont de la typographie française délibérée
# (« », espaces insécables, apostrophes typographiques) et de la notation
# mathématique (σ, ×, →, ≥). Les signaler noierait les vraies alertes.
#
# Compromis assumé : on perd la protection homoglyphe sur un dépôt à un
# seul auteur, on garde une sortie de linter lisible. À réactiver le jour
# où le projet accepte des contributions extérieures.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Les scripts de démonstration impriment beaucoup : on y tolère les lignes
# longues, que le code de la bibliothèque, lui, n'a pas le droit d'avoir.
"examples/*.py" = ["E501"]

[tool.mypy]
# Pas de python_version épinglé : mypy utilise l'interpréteur courant.
# L'épingler à 3.11 faisait échouer l'analyse des stubs numpy, qui
# utilisent une syntaxe 3.12+.
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/nkrisk"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]
